worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    include /var/run/nginx/trusted-proxies.conf;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /var/www/client_body_temp;
    proxy_temp_path /var/www/proxy_temp;
    fastcgi_temp_path /var/www/fastcgi_temp;
    uwsgi_temp_path /var/www/uwsgi_temp;
    scgi_temp_path /var/www/scgi_temp;
    access_log /dev/stdout;

    # Evaluate the original TCP peer before nginx real_ip rewrites remote_addr.
    geo $realip_remote_addr $trusted_http_proxy {
        default 0;
        include /var/run/nginx/trusted-proxy-geo.conf;
    }
    map "$trusted_http_proxy:$http_x_forwarded_proto" $safe_forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    map $http_upgrade $safe_upgrade {
        websocket websocket;
        default '';
    }
    map $safe_upgrade $connection_upgrade {
        default upgrade;
        '' keep-alive;
    }

    server {
        listen 8080;
        listen [::]:8080;
        client_max_body_size 8m;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Gate every resource, including static SPA, API and WS handshakes.
        auth_request /_yacht_access;
        location = /_yacht_access {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:8000/internal/access;
            proxy_pass_request_body off;
            proxy_set_header Content-Length '';
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $safe_forwarded_proto;
            proxy_set_header Connection '';
        }
        location = /internal/access { deny all; }

        location ~ ^/(auth|setup|dashboard|apps|templates|resources|compose|registries|containers|search|watchtower|settings|audit)(/|$) {
            rewrite ^/(.*)$ /api/$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $safe_forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $safe_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $safe_forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $safe_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
        }
        location / {
            root /app;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
