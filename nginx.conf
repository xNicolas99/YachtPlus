worker_processes auto;
error_log /var/log/nginx/error.log warn;

# user directive is not needed when running as non-root
# user appuser appuser;

pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    ### Set http options
    # fallback in case we can't determine a type
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Access log to stdout
    access_log /var/log/nginx/access.log;

    # Filter the Upgrade header: only pass `websocket` through. Anything
    # else (h2c, h2, anything custom) is collapsed to an empty string before
    # it ever reaches the upstream. This blocks H2C-smuggling attacks where
    # a client sends `Upgrade: h2c` to switch the upstream connection to
    # HTTP/2 framing — subsequent pooled HTTP/1 requests would otherwise be
    # interpreted as HTTP/2 frames by the upstream.
    map $http_upgrade $safe_upgrade {
        websocket $http_upgrade;
        default '';
    }

    # Derive Connection header from the *filtered* upgrade value, not the
    # raw client header. Empty upgrade -> keep-alive (needed for SSE).
    map $safe_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # Paths for Vue and FastAPI
    server {
        listen *:8080;

        # Fix: Rewrite frontend requests missing the /api prefix
        location ~ ^/(auth|setup|dashboard|apps|templates|resources|compose|registries|containers|search|watchtower|settings|audit)(/|$) {
            rewrite ^/(.*)$ /api/$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for long-running operations (e.g. Docker pulls)
            proxy_read_timeout 300s;
            proxy_http_version 1.1;

            # Upgrade Logic for WebSockets and SSE — pass the FILTERED
            # upgrade value (see $safe_upgrade map above) so only
            # `websocket` ever reaches the upstream.
            proxy_set_header Upgrade $safe_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering for SSE to work correctly
            proxy_buffering off;
            proxy_cache off;

            proxy_redirect off;
        }

        # Vue
        location / {
            root /app;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # FastAPI
        location /api/ {
            proxy_pass http://127.0.0.1:8000; # No trailing slash to preserve /api prefix
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeout for long-running operations (e.g. Docker pulls)
            proxy_read_timeout 300s;
            proxy_http_version 1.1;

            # Upgrade Logic for WebSockets and SSE — pass the FILTERED
            # upgrade value (see $safe_upgrade map above) so only
            # `websocket` ever reaches the upstream.
            proxy_set_header Upgrade $safe_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering for SSE to work correctly
            # Explicitly turn off proxy buffering for the API location
            proxy_buffering off;
            proxy_cache off;

            client_body_temp_path /var/www/client_body_temp;
            proxy_temp_path /var/www/proxy_temp;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
        }
    }
}
