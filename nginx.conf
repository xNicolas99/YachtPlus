worker_processes 1;

# user directive is not needed when running as non-root
# user appuser appuser;

pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    ### Set http options
    # fallback in case we can't determine a type
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Map Upgrade header to Connection header
    # If Upgrade is present (WebSocket), Connection = upgrade
    # If Upgrade is empty (Normal HTTP/SSE), Connection = keep-alive (to support SSE)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    upstream api_server {
        server unix:/tmp/gunicorn.sock fail_timeout=0;
    }

    # Paths for Vue and FastAPI
    server {
        listen *:8080;

        # Vue
        location / {
            root /app;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # FastAPI
        location /api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            
            # Increase timeout for long-running operations (e.g. Docker pulls)
            proxy_read_timeout 300s;
            proxy_http_version 1.1;

            # Upgrade Logic for WebSockets and SSE
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable buffering for SSE to work correctly
            # Explicitly turn off proxy buffering for the API location
            proxy_buffering off;
            proxy_cache off;

            client_body_temp_path /var/www/client_body_temp;
            proxy_temp_path /var/www/proxy_temp;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://api_server/;
        }
    }
}
