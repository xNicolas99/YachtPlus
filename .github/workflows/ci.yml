name: CI — Tests, Ruff, Build, Docker-Smoke

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --require-hashes -r requirements-dev.lock

      - name: Run backend tests
        run: python -m pytest tests -q --tb=short

      - name: Test publication policy and image failsafes
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run Alembic migrations on a throwaway SQLite database
        run: |
          mkdir -p /tmp/yachtplus_alembic
          DATABASE_URL=sqlite:////tmp/yachtplus_alembic/test.db alembic upgrade head

      - name: Build Docker image (smoke)
        run: docker build -t yachtplus:ci-smoke ..

      - name: Check release image contents
        run: docker run --rm --entrypoint sh yachtplus:ci-smoke /scripts/image-smoke-test.sh

      - name: Check running release image
        run: |
          # Isolated startup only; mandatory protection is tested by security-stack.
          docker run -d --name yachtplus-ci -e YACHT_FAIL2BAN_REQUIRED=false -p 127.0.0.1:18080:8080 yachtplus:ci-smoke
          trap 'docker logs yachtplus-ci; docker rm -f yachtplus-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/setup/status >/dev/null && \
               curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

  security-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify active fail2ban, proxy access and protection failsafes
        run: python scripts/security-stack-smoke.py --timeout 600

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter (informational)
        run: ruff check ./backend/api
        continue-on-error: true

  # Publication lives in the validation run: no privileged workflow_run,
  # cross-run artifacts, PR publishing, or independent registry workflows.
  publish:
    needs: [backend-tests, frontend-tests, security-stack, ruff]
    if: >-
      ${{ success() && !cancelled() && github.event_name == 'push' &&
          github.repository == 'xNicolas99/YachtPlus' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: yachtplus-ghcr-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify publication policy and canonical version
        id: release
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_CANCELLED: ${{ job.status == 'cancelled' }}
        run: python scripts/release_gate.py

      - name: Build release candidate
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build --build-arg "VITE_VERSION=$RELEASE_VERSION" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/xNicolas99/YachtPlus" \
            --iidfile /tmp/yachtplus-release-image-id \
            -t yachtplus:release-candidate .

      - name: Validate candidate contents, frontend version and health
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          candidate="$(cat /tmp/yachtplus-release-image-id)"
          docker run --rm --entrypoint sh "$candidate" /scripts/image-smoke-test.sh
          docker run --rm --entrypoint python3 "$candidate" -c \
            'import json,sys; assert json.load(open("/app/version.json")) == {"version": sys.argv[1]}' "$RELEASE_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$candidate")" = "$RELEASE_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$candidate")" = "$GITHUB_SHA"
          # Exercise real protection using the exact image ID that will be pushed.
          python scripts/security-stack-smoke.py --image "$candidate" --timeout 600
          # Separate isolated startup check; protected deployment passed above.
          docker run -d --name yachtplus-release -e YACHT_FAIL2BAN_REQUIRED=false -p 127.0.0.1:18080:8080 "$candidate"
          trap 'docker logs yachtplus-release; docker rm -f yachtplus-release' EXIT
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{.State.Health.Status}}' yachtplus-release)"
            if [ "$health" = healthy ] && \
               curl --fail --silent http://127.0.0.1:18080/api/setup/status >/dev/null && \
               curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              exit 0
            fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          exit 1

      - name: Recheck remote ref before publication
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_CANCELLED: ${{ job.status == 'cancelled' }}
        run: python scripts/release_gate.py --verify-remote

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the checked candidate without rebuilding
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          candidate="$(cat /tmp/yachtplus-release-image-id)"
          while IFS= read -r tag; do
            docker tag "$candidate" "$RELEASE_IMAGE:$tag"
            docker push "$RELEASE_IMAGE:$tag"
          done <<< "$RELEASE_TAGS"
