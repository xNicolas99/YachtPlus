version: "3"
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: yacht-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - EXEC=1
      - POST=1
      # Restrictions
      - AUTH=0
      - SECRETS=0
      - SWARM=0
      - SYSTEM=0
      - NODES=0
      - CONFIGS=0
      - PLUGINS=0
    networks:
      - yacht-net

  yachtplus:
    image: ghcr.io/yachtplus/yachtplus:devel
    container_name: yachtplus
    restart: unless-stopped
    depends_on:
      - socket-proxy
    environment:
      - DOCKER_GID=${DOCKER_GID:-}
      - DOCKER_HOST=tcp://socket-proxy:2375
    ports:
      - "8000:8080"
    volumes:
      # Socket is NO LONGER mounted here
      # - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    networks:
      - yacht-net

networks:
  yacht-net:
    driver: bridge
