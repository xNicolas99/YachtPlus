version: "3"
services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy
    container_name: yacht-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1 # Erlaubt Steuerung (Start/Stop), blockiert aber gefährliche Host-Befehle
    networks:
      - yacht-net

  yachtplus:
    image: ghcr.io/yachtplus/yachtplus:devel
    container_name: yachtplus
    restart: unless-stopped
    depends_on:
      - dockerproxy
    environment:
      - DOCKER_GID=${DOCKER_GID:-}
      - DOCKER_HOST=tcp://dockerproxy:2375 # Proxy statt direktem Socket
    ports:
      - "8000:8080"
    volumes:
      # Socket is NO LONGER mounted here
      # - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    networks:
      - yacht-net

networks:
  yacht-net:
    driver: bridge
