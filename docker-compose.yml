version: '3.8'
services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1 # Erlaubt Steuerung (Start/Stop), blockiert aber gefährliche Host-Befehle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # Standard container hardening — applies to both services. The socket
    # proxy never needs to escalate privileges or write to its own FS, and
    # capping memory keeps a compromised proxy from being weaponised as a
    # DoS lever against the host.
    security_opt:
      - no-new-privileges:true
    read_only: true
    # tecnativa/docker-socket-proxy's entrypoint writes its haproxy
    # config to /tmp/haproxy.cfg on every start. With read_only: true
    # alone the container crash-loops with `can't create /tmp/haproxy.cfg:
    # Read-only file system`. tmpfs gives /tmp a writable in-memory
    # mount while keeping the rest of the rootfs read-only.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

  yachtplus:
    build: .
    ports:
      # Host 8000 -> container 8080 (nginx). Nginx serves the Vue SPA
      # from / and reverse-proxies /api/* to gunicorn on 127.0.0.1:8000
      # *inside* the container. Mapping host 8000 -> container 8000
      # would bypass nginx and expose only the raw FastAPI, with no UI
      # and no SPA routing — that was the "I can't access it" symptom.
      - "8000:8080"
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375 # Proxy statt direktem Socket
    depends_on:
      - dockerproxy
    restart: unless-stopped
    # YachtPlus itself does not need any host capability beyond the ones
    # the runtime asks for explicitly. start.sh chmods /config + bind-mounts
    # so the FS isn't read-only, but no-new-privileges + dropping the full
    # cap set still blocks the common privilege-escalation paths.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # start.sh chowns /config to appuser
      - SETUID         # gosu drops to appuser
      - SETGID
      - DAC_OVERRIDE   # nginx writes pid + cache to mounted volumes
      - NET_BIND_SERVICE  # nginx listens on 8080
    mem_limit: 1g
    pids_limit: 200
