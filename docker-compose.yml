# Default deployment: LAN access, mandatory fail2ban, capability-free app.
services:
  dockerproxy:
    labels:
      local.yachtplus.infrastructure: docker-proxy
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      BUILD: 1
      EXEC: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

  fail2ban:
    labels:
      local.yachtplus.infrastructure: fail2ban
    build: ./fail2ban
    user: "1001:1000"
    network_mode: none
    volumes:
      - yacht_security_logs:/config/security:ro
      - yacht_security_state:/run/yachtplus-security
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1000,mode=0700,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 50

  yachtplus:
    labels:
      local.yachtplus.infrastructure: application
    build: .
    user: "1000:1000"
    ports:
      - "8000:8080"
    environment:
      DOCKER_HOST: tcp://dockerproxy:2375
      YACHT_DOCKER_PROXY_NETWORK: ${COMPOSE_PROJECT_NAME:-yachtplus}_docker_api
      YACHT_ALLOW_PRIVATE_NETWORK_HOSTS: "true"
      YACHT_ALLOWED_HOSTS: ${YACHT_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      YACHT_HTTP_TRUSTED_PROXIES: ${YACHT_HTTP_TRUSTED_PROXIES:-}
      YACHT_TRUSTED_PROXIES: "127.0.0.1,::1"
      YACHT_FAIL2BAN_REQUIRED: "true"
      YACHT_FAIL2BAN_STATE_DIR: /run/yachtplus-security
      YACHT_SECURITY_LOG: /config/security/auth.log
      FORWARDED_ALLOW_IPS: ""
    depends_on:
      dockerproxy:
        condition: service_started
      fail2ban:
        condition: service_healthy
    networks:
      - docker_api
      - app_egress
    restart: unless-stopped
    volumes:
      - yacht_config:/config
      - yacht_compose:/compose
      - yacht_security_logs:/config/security
      - yacht_security_state:/run/yachtplus-security:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,nosuid,nodev,size=128m
      - /var/run/nginx:uid=1000,gid=1000,mode=0700,nosuid,nodev,size=8m
      - /var/www:uid=1000,gid=1000,mode=0700,nosuid,nodev,size=64m
      - /home/appuser:uid=1000,gid=1000,mode=0700,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 200

volumes:
  yacht_config:
  yacht_compose:
  yacht_security_logs:
  yacht_security_state:

networks:
  docker_api:
    name: ${COMPOSE_PROJECT_NAME:-yachtplus}_docker_api
    internal: true
  app_egress:
