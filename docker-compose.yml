version: '3.8'
services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1 # Erlaubt Steuerung (Start/Stop), blockiert aber gefährliche Host-Befehle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  yachtplus:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375 # Proxy statt direktem Socket
    depends_on:
      - dockerproxy
    restart: unless-stopped
